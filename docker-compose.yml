# music-monitor —— 在 go-music-dl 之上增加「榜单/歌单/收藏夹 监控自动下载」
#
# 用法：
#   拉现成镜像启动：  docker compose pull && docker compose up -d
#   改代码后本地构建： docker compose up -d --build
#   离线镜像包部署：    docker load -i music-monitor.tar && docker compose up -d
# 国内直连 Docker Hub 常超时，先配镜像加速（见 docs/deploy.md）。
# 启动后访问 http://<NAS-IP>:9090

services:
  # 上游下载引擎（官方镜像）。monitor 的搜索/下载都走它的 HTTP 接口，勿删。
  music-dl:
    image: guohuiyuan/go-music-dl:latest
    container_name: go-music-dl
    restart: unless-stopped
    ports:
      - "${ENGINE_PORT:-8085}:8080"
    volumes:
      # 引擎把配置/状态与下载音乐都写在 data 根下，用两条挂载拆开：
      #   外层接住整个 data 根 → config/engine/（配置、Cookie、SQLite）
      #   内层单独接住 downloads → data/（音乐文件，路径更深会覆盖外层）
      - ${ENGINE_CONFIG_DIR:-./config/engine}:/home/appuser/data
      - ${DOWNLOADS_DIR:-./data/downloads}:/home/appuser/data/downloads
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    user: "1000:1000"   # 官方镜像以 uid=1000 运行，需宿主机目录可写

  # 监控编排服务（本项目新增）。image 与 build 并存：有镜像直接用，加 --build 才走本地构建。
  monitor:
    image: ${MONITOR_IMAGE:-baey666/music-monitor:v${APP_VERSION:-1.0.0}}
    build:
      context: ./monitor
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        APT_MIRROR: ${APT_MIRROR:-}   # 构建期源加速（国内必开，见 .env.example）
        PIP_INDEX: ${PIP_INDEX:-}
    container_name: music-monitor
    restart: unless-stopped
    ports:
      - "${MONITOR_PORT:-9090}:9090"
    volumes:
      - ${MONITOR_CONFIG_DIR:-./config/monitor}:/app/data  # 监控配置库（SQLite）
    environment:
      - ENGINE_URL=http://music-dl:8080
      - ENGINE_PREFIX=${ENGINE_PREFIX:-/music}
      - TICK_SECONDS=${TICK_SECONDS:-60}
      - DOWNLOAD_CONCURRENCY=${DOWNLOAD_CONCURRENCY:-3}
      - DEFAULT_QUALITY=${DEFAULT_QUALITY:-lossless}
      - TZ=${TZ:-Asia/Shanghai}
    depends_on:
      - music-dl
    user: "1000:1000"
