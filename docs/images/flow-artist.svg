<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <title>歌手关注是怎么工作的</title>
  <desc>歌手名经过搜索、歌手名复核两道关口后交给通用下载流程，混进来的翻唱会被剔除。</desc>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g>
    <rect x="330" y="24" width="220" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text x="440" y="46" text-anchor="middle" font-size="15" font-weight="500" fill="#3C3489">你填的歌手名</text>
    <text x="440" y="66" text-anchor="middle" font-size="12.5" fill="#534AB7">例如：周杰伦</text>
  </g>
  <path d="M440 80 V110" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#b)"/>

  <g>
    <rect x="240" y="114" width="400" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
    <text x="440" y="136" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">① 拿歌手名去搜索</text>
    <text x="440" y="156" text-anchor="middle" font-size="12.5" fill="#0F6E56">搜「周杰伦」相关的所有结果</text>
  </g>

  <text x="128" y="256" text-anchor="end" font-size="12.5" font-weight="500" fill="#185FA5">② 按歌手名挑一遍</text>

  <path d="M340 170 V196" fill="none" stroke="#888780" stroke-width="1.5"/>
  <path d="M540 170 V196" fill="none" stroke="#888780" stroke-width="1.5"/>
  <path d="M340 196 H540" fill="none" stroke="#888780" stroke-width="1.5"/>
  <path d="M235 196 V222" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#b)"/>
  <path d="M440 196 V222" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#b)"/>
  <path d="M645 196 V222" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#b)"/>
  <path d="M235 196 H645" fill="none" stroke="#888780" stroke-width="1.5"/>

  <g>
    <rect x="150" y="226" width="170" height="52" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
    <text x="235" y="247" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">歌手 = 周杰伦</text>
    <text x="235" y="266" text-anchor="middle" font-size="12" fill="#0F6E56">留下 ✓</text>
  </g>
  <g>
    <rect x="355" y="226" width="170" height="52" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
    <text x="440" y="247" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">周杰伦/杨瑞代</text>
    <text x="440" y="266" text-anchor="middle" font-size="12" fill="#0F6E56">合作曲 留下 ✓</text>
  </g>
  <g>
    <rect x="560" y="226" width="170" height="52" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/>
    <text x="645" y="247" text-anchor="middle" font-size="13" font-weight="500" fill="#791F1F">某翻唱歌手</text>
    <text x="645" y="266" text-anchor="middle" font-size="12" fill="#A32D2D">扔掉 ✗</text>
  </g>

  <path d="M235 278 V300" fill="none" stroke="#888780" stroke-width="1.5"/>
  <path d="M440 278 V300" fill="none" stroke="#888780" stroke-width="1.5"/>
  <path d="M235 300 H440" fill="none" stroke="#888780" stroke-width="1.5"/>
  <path d="M337 300 V326" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#b)"/>

  <g>
    <rect x="140" y="330" width="600" height="66" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
    <text x="440" y="354" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">③ 交给后面的通用流程（四种监控类型共用）</text>
    <text x="440" y="378" text-anchor="middle" font-size="12.5" fill="#5F5E5A">比对新歌 → 检查版本音源 → 挑音质 → 跨平台换源 → 下载 → 去重</text>
  </g>
</svg>
