# ============================================================================
#  构建镜像并推送到 Docker Hub
#
#  为什么需要这个文件：
#    国内网络下 registry-1.docker.io / auth.docker.io / hub.docker.com 全部不可达，
#    push 必须连这几个域名，而镜像加速器只代理「拉取」、不代理「推送」。
#    所以「本地构建 + docker push」在国内是走不通的。
#    GitHub 的 runner 在境外，网络不受限，由它来 build + push 是最省事的绕路。
#
#  ── 启用前需要做两件事 ──────────────────────────────────────────────────────
#  1. 在 Docker Hub 生成 Access Token（不要用登录密码）
#     https://hub.docker.com/settings/security → New Access Token → 权限 Read & Write
#
#  2. 在 GitHub 仓库里加两个 Secret
#     仓库页 → Settings → Secrets and variables → Actions → New repository secret
#       DOCKERHUB_USERNAME  = 你的 Docker ID（不是邮箱）
#       DOCKERHUB_TOKEN     = 上一步生成的 Access Token
#
#  ── 触发方式 ───────────────────────────────────────────────────────────────
#   · push 到 main        → 构建并推 :latest 和 :sha-xxxxxxx
#   · 推送 v1.2.3 形式的 tag → 额外推 :1.2.3 和 :1.2
#   · 也可以在 Actions 页面手动触发（workflow_dispatch）
#
#  镜像地址：<DOCKERHUB_USERNAME>/music-monitor
# ============================================================================
name: Build and push to Docker Hub

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 提前拦一道：Secret 没配 / 配错标签页时，直接给出中文原因，
      # 否则 login-action 只会丢一句 "Username and password required"，很难排查。
      - name: 检查 Docker Hub Secret 是否就位
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -z "$DH_USER" ]  && missing="$missing DOCKERHUB_USERNAME"
          [ -z "$DH_TOKEN" ] && missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::缺少 Secret:$missing"
            echo "请检查是否加在【Settings → Secrets and variables → Actions】标签页。"
            echo "常见错误：加到了相邻的 Dependabot 或 Environments 标签页 —— 那两个位置 workflow 读不到。"
            echo "另外确认名字拼写为 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN（下划线、全大写），且是 Repository secret 而非 Variable。"
            exit 1
          fi
          echo "Secret 已就位：DOCKERHUB_USERNAME 长度 ${#DH_USER}，DOCKERHUB_TOKEN 长度 ${#DH_TOKEN}"

      - name: 安装 QEMU（多架构构建用）
        uses: docker/setup-qemu-action@v3

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/music-monitor
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ./monitor
          file: ./monitor/Dockerfile
          # 两种架构都构建，x86_64 和 ARM 的 NAS 都能用
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=1.0.0
          # 用 GitHub Actions 缓存，重复构建快很多
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 单平台 provenance 会生成多余的 manifest，关掉更干净
          provenance: false
