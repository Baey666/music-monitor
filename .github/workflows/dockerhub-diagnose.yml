# ============================================================================
#  Docker Hub 凭据诊断
#
#  用途：Actions 里 docker/login-action 报
#        "unauthorized: incorrect username or password" 时，用它定位到底是
#        DOCKERHUB_USERNAME 错了，还是 DOCKERHUB_TOKEN 无效（或过期/被撤销）。
#
#  只手动触发，不做任何推送。日志里只打印 Token 的前 9 位（固定为 dckr_pat_），
#  不打印完整 Token。
# ============================================================================
name: Diagnose Docker Hub credentials

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 0) Secret 形态检查
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "USER  长度=${#DH_USER}   值=[$DH_USER]"
          echo "TOKEN 长度=${#DH_TOKEN}  前缀=[${DH_TOKEN:0:9}]..."

          case "$DH_USER"  in *[[:space:]]*) echo "::error::USERNAME 里含空白字符（多半是粘贴时带了空格/换行）" ;; esac
          case "$DH_TOKEN" in *[[:space:]]*) echo "::error::TOKEN 里含空白字符（多半是粘贴时带了空格/换行）" ;; esac

          if [ "${DH_TOKEN:0:9}" != "dckr_pat_" ]; then
            echo "::error::TOKEN 前缀不是 dckr_pat_ —— 你复制的不是 Docker Hub Access Token，可能是别的东西（比如密码、或 token 列表里的描述文字）"
          else
            echo "TOKEN 前缀正常（dckr_pat_）"
          fi

      - name: 1) 该用户名在 Docker Hub 是否存在
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          code=$(curl -s -o /tmp/u.json -w '%{http_code}' "https://hub.docker.com/v2/users/$DH_USER/")
          echo "GET https://hub.docker.com/v2/users/$DH_USER/  ->  HTTP $code"
          echo "----- 响应前 500 字节 -----"
          head -c 500 /tmp/u.json; echo
          if [ "$code" = "200" ]; then
            echo "==> 用户存在。若下一步 401，则问题在 TOKEN。"
          elif [ "$code" = "404" ]; then
            echo "::error::用户名不存在 —— DOCKERHUB_USERNAME 填错了（注意用的是 Docker ID / 用户名，不是邮箱、不是 Full Name）"
          else
            echo "::warning::意外状态码 $code，可能是 Docker Hub 限流或网络抖动"
          fi

      - name: 2) 用 username + token 换 JWT
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/login.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            --data "$(python3 -c "import json,os;print(json.dumps({'username':os.environ['DH_USER'],'password':os.environ['DH_TOKEN']}))")" \
            https://hub.docker.com/v2/users/login)
          echo "POST https://hub.docker.com/v2/users/login  ->  HTTP $code"
          if [ "$code" = "200" ]; then
            echo "==> 凭据有效！username 与 token 这组搭配是对的。"
          elif [ "$code" = "401" ]; then
            echo "::error::凭据被拒（401）—— TOKEN 无效：可能已过期、已被撤销、或复制时截断/多带了字符。请重新生成一个 Access Token。"
          else
            echo "::warning::意外状态码 $code"
            head -c 300 /tmp/login.json; echo
          fi

      - name: 3) registry token 端点复核
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/tok.json -w '%{http_code}' -u "$DH_USER:$DH_TOKEN" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/alpine:pull")
          echo "GET https://auth.docker.io/token  ->  HTTP $code   （200=凭据可用于推送/拉取，401=凭据无效）"
          if [ "$code" != "200" ]; then head -c 300 /tmp/tok.json; echo; fi
